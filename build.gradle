plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url 'https://maven.wispforest.io/releases' }     // Accessories
    maven { url 'https://maven.shedaniel.me/' }               // Cloth Config (Accessories transitive dep)
    maven { url 'https://maven.blamejared.com/' }             // JEI
    maven { url 'https://maven.terraformersmc.com/releases/' } // Mod Menu
    // maven { url 'https://maven.valkyrienskies.org' }        // Valkyrien Skies - not yet integrated
    flatDir { dirs 'libs' }                                    // Polymorph - not on a public maven we could pin reliably
    maven { url 'https://maven.parchmentmc.org/' }             // Parchment (parameter names on top of Mojmap)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"

    // Mod Menu / Cloth Config are optional - OvergearedConfigScreen is only classloaded when Mod
    // Menu calls the "modmenu" entrypoint, so the mod must still run without either installed.
    modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.mod_menu_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    // Polymorph is optional - lets the player choose between ambiguous forging recipe matches.
    // Anvil.getCurrentRecipe() checks FabricLoader.isModLoaded("polymorph") before touching any
    // of these classes, so the mod must still run without it installed.
    modCompileOnly files("libs/polymorph-fabric-0.49.10+1.20.1.jar")
    modLocalRuntime files("libs/polymorph-fabric-0.49.10+1.20.1.jar")

    // PlayerMixin uses MixinExtras' expression matching. Accessories happens to bundle its own
    // copy too, but Accessories is only a soft dependency - jar-in-jar our own copy so this mixin
    // doesn't crash on load when the mod runs without Accessories installed. MixinExtras is
    // designed to support multiple mods each embedding a copy safely.
    include(modImplementation("io.github.llamalad7:mixinextras-fabric:0.5.4"))
}

fabricApi {
    configureDataGeneration()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    accessWidenerPath = file("src/main/resources/overgeared.accesswidener")
}
