plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = "${project.archives_base_name}-fabric" }

repositories {
    maven { url = 'https://maven.shedaniel.me/' }               // Cloth Config
    maven { url = 'https://maven.blamejared.com/' }             // JEI
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
    // Accessories (maven.wispforest.io) has no 26.3 build yet - see compat/accessories (disabled).
    // Valkyrien Skies has no Fabric 26.3 build yet - ValkyrienSkiesCompat stays a stub.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu / Cloth Config are optional - OvergearedConfigScreen is only classloaded when Mod
    // Menu calls the "modmenu" entrypoint, so the mod must still run without either installed.
    compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    localRuntime "com.terraformersmc:modmenu:${project.mod_menu_version}"
    localRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    // MixinExtras (used by PlayerMixin) ships with Fabric Loader, so it no longer needs bundling.
}

fabricApi {
    // Headless game test server (./gradlew runGameTest): boots a world and loads every datapack
    // registry without needing a client or eula.txt - catches data/registry errors early.
    configureTests {
        createSourceSet = false
        modId = "overgeared"
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
    configureDataGeneration {
        // Model providers live in the client-only net.minecraft.client.data package in 26.x.
        client = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "5000"]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
