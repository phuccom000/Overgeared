plugins {
    // Loaded once here so the subprojects share the plugin classes.
    id 'fabric-loom' version "${fabric_loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    group = project.maven_group
    version = project.mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroupAndSubgroups('org.spongepowered') }
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = 'ParchmentMC'
                        url = 'https://maven.parchmentmc.org/'
                    },
                    maven {
                        name = 'NeoForge'
                        url = 'https://maven.neoforged.net/releases'
                    }
            )
            filter { includeGroup('org.parchmentmc.data') }
        }
        maven {
            // JEI, CraftTweaker, Bookshelf
            name = "BlameJared"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // JEI mirror
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            // EMI, ModMenu
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        exclusiveContent {
            // KubeJS, Rhino
            forRepository {
                maven {
                    name = "LatvianModder"
                    url = "https://maven.latvian.dev/releases"
                }
            }
            filter { includeGroup "dev.latvian.mods" }
        }
        exclusiveContent {
            forRepository {
                maven { url "https://cursemaven.com" }
            }
            filter { includeGroup "curse.maven" }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter { includeGroup "maven.modrinth" }
        }
        maven {
            name = "RyanHCode Maven"
            url = "https://maven.ryanhcode.dev/releases"
        }
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.named('jar', Jar) {
        exclude '.cache'
    }

    // Values substituted into fabric.mod.json / neoforge.mods.toml.
    def expandProps = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            fabric_loader_version  : fabric_loader_version,
            fabric_version         : fabric_version,
    ]
    tasks.withType(ProcessResources).configureEach {
        inputs.properties expandProps
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
            expand expandProps
        }
    }
}
