plugins {
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/multiloader-loader.gradle')

base {
    archivesName = "${mod_id}-fabric"
}

dependencies {
    // 26.x ships unobfuscated, so there are no mappings and no remapping.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/overgeared.accesswidener')
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('runs/client')
            // ./gradlew :fabric:runClient -PquickPlay=<world> loads straight into a singleplayer world
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
