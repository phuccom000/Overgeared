// Shared setup for the Fabric and NeoForge projects: compile the common sources and
// resources directly into each loader's jar.
configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Compat packages excluded in common/build.gradle (mods without a build for this version).
def commonProject = project(':common')
afterEvaluate {
    tasks.named('compileJava', JavaCompile) { exclude(commonProject.ext.disabledCompat) }
    tasks.named('javadoc', Javadoc) { exclude(commonProject.ext.disabledCompat) }
}
