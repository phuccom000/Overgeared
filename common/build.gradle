plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-common"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Integrations whose mods have no 26.3 build yet. The safe wrappers they are reached through
// (compat/polymorph/Polymorph, compat/sable/SableCompat) stay compiled and report "not loaded".
// Remove an entry here (and restore its dependency) once the mod is updated.
def disabledCompat = [
        'net/stirdrem/overgeared/compat/emi/**',
        'net/stirdrem/overgeared/compat/kubejs/**',
        'net/stirdrem/overgeared/compat/ali/**',
        'net/stirdrem/overgeared/compat/polymorph/PolymorphIntegration.java',
        'net/stirdrem/overgeared/compat/polymorph/SmithingAnvilRecipeData.java',
        'net/stirdrem/overgeared/compat/polymorph/client/**',
]
sourceSets.main.java.exclude(disabledCompat)

// Vanilla-only mode: compiles against Minecraft without any loader.
neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('accesstransformer.cfg'))
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'

    // Recipe viewers (multiplatform APIs)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

// Expose the common sources and resources to the loader projects, which compile them in.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.files.each { dir ->
        commonResources dir
    }
}

// The loaders compile the raw common source directory, so hand them the same exclusions.
ext.disabledCompat = disabledCompat
