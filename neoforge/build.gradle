plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/multiloader-loader.gradle')

base {
    archivesName = "${mod_id}-neoforge"
}

def commonProject = project(':common')

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_version
        minecraftVersion = minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            // Generated resources are shared by both loaders, so they live in the common project.
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', commonProject.file('src/generated/resources/').getAbsolutePath(),
                    '--existing', commonProject.file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The shared mixin config names the refmap Loom generates for Fabric; NeoForge runs on Mojang names and has none.
tasks.named('processResources', ProcessResources) {
    filesMatching('overgeared.mixins.json') {
        filter { String line -> line.contains('"refmap"') ? null : line }
    }
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // EMI
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    //runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // KubeJS (optional: anvil tiers from startup scripts)
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"

    // PolyMorph
    implementation "maven.modrinth:polymorph:${polymorph_version}"

    implementation "curse.maven:create-328085:7963363"
    api("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
    //runtimeOnly "curse.maven:sable-1312371:8007005"
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:[${sable_companion_version},)")) {
        version {
            prefer sable_companion_version
        }
    }
    //implementation "maven.modrinth:create-aeronautics:1.1.3+mc1.21.1"
    compileOnly "curse.maven:wooden-tools-are-dumb-736942:5695358"
    implementation "curse.maven:selene-499980:7708176"
    runtimeOnly "curse.maven:mmmmmmmmmmmm-225738:7206981"
    implementation "curse.maven:dragons-survival-420799:8792066"
    implementation "curse.maven:geckolib-388172:7707149"
    implementation "curse.maven:knight-lib-1105855:8859434"
    implementation "curse.maven:clockwork-596411:8857305"
    implementation "curse.maven:advanced-core-info-1661923:9083066"
    implementation "curse.maven:advanced-loot-info-1205426:9083071"
    implementation "curse.maven:ali-compat-1700110:9002626"
    implementation "curse.maven:aquaculture-60028:7901588"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
